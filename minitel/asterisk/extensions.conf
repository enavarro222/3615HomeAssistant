[general]
static=yes
writeprotect=yes

; Options de Softmodem pour un Minitel :
;   v(V23)  1200 bauds vers le Minitel, 75 bauds depuis le Minitel
;   l       bit de poids faible d'abord, comme toute liaison série (le défaut est l'inverse)
;   d(7)e   7 bits, parité paire
;   s(1)    1 bit de stop
;   t(-8)   niveau d'émission en dBm0, à ajuster si le Minitel décroche mal
[minitel]
exten => 3615,1,Answer()
 same => n,Softmodem(127.0.0.1,3615,v(V23)ld(7)es(1)t(-8))
 same => n,Hangup()

exten => _X.,1,Hangup()
