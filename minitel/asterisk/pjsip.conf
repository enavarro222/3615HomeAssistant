; Les mots de passe et le réseau sont injectés au démarrage par entrypoint.sh.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Rien en dehors du LAN ne doit pouvoir s'enregistrer.
[lan-only]
type=acl
deny=0.0.0.0/0.0.0.0
permit=@LAN_CIDR@
; Le panneau de test de l'app appelle depuis la machine même.
permit=127.0.0.1/32

[minitel]
type=endpoint
context=minitel
disallow=all
allow=alaw
auth=minitel-auth
aors=minitel
direct_media=no

[minitel-auth]
type=auth
auth_type=userpass
username=minitel
password=@SIP_PASSWORD@

; Plusieurs adaptateurs peuvent partager le compte, un par Minitel. Au-delà de
; 4, ou quand un adaptateur redémarre, le contact le plus ancien est remplacé.
[minitel]
type=aor
max_contacts=4
remove_existing=yes

; Le Minitel logiciel du panneau de test. Un compte à part, pour ne pas
; déloger l'adaptateur, joignable seulement depuis la machine, avec un mot de
; passe tiré à chaque démarrage. Il appelle sans s'enregistrer.
[minitel-web]
type=endpoint
context=minitel
disallow=all
allow=alaw
auth=minitel-web-auth
direct_media=no
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/32

[minitel-web-auth]
type=auth
auth_type=userpass
username=minitel-web
password=@WEB_SIP_PASSWORD@
